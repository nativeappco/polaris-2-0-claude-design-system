<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Badge fills</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--p-color-bg-fill-secondary)"></div><div class="n">neutral</div><div class="v">bg-fill-secondary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-badge-bg-fill-info)"></div><div class="n">info</div><div class="v">badge-bg-fill-info</div></div><div class="sw"><div class="chip" style="background:var(--p-color-badge-bg-fill-success)"></div><div class="n">success</div><div class="v">badge-bg-fill-success</div></div><div class="sw"><div class="chip" style="background:var(--p-color-badge-bg-fill-caution)"></div><div class="n">caution</div><div class="v">badge-bg-fill-caution</div></div><div class="sw"><div class="chip" style="background:var(--p-color-badge-bg-fill-warning)"></div><div class="n">warning</div><div class="v">badge-bg-fill-warning</div></div><div class="sw"><div class="chip" style="background:var(--p-color-badge-bg-fill-critical)"></div><div class="n">critical</div><div class="v">badge-bg-fill-critical</div></div></div></body></html>
