<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Text & icon</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--p-color-text)"></div><div class="n">text</div><div class="v">text</div></div><div class="sw"><div class="chip" style="background:var(--p-color-text-secondary)"></div><div class="n">secondary</div><div class="v">text-secondary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-text-tertiary)"></div><div class="n">tertiary</div><div class="v">text-tertiary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-text-disabled)"></div><div class="n">disabled</div><div class="v">text-disabled</div></div><div class="sw"><div class="chip" style="background:var(--p-color-text-link)"></div><div class="n">link</div><div class="v">text-link</div></div><div class="sw"><div class="chip" style="background:var(--p-color-icon-secondary)"></div><div class="n">icon secondary</div><div class="v">icon-secondary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-nav-text)"></div><div class="n">nav text</div><div class="v">nav-text</div></div></div></body></html>
