<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tone surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-info)"></div><div class="n">info</div><div class="v">bg-surface-info</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-success)"></div><div class="n">success</div><div class="v">bg-surface-success</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-caution)"></div><div class="n">caution</div><div class="v">bg-surface-caution</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-warning)"></div><div class="n">warning</div><div class="v">bg-surface-warning</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-critical)"></div><div class="n">critical</div><div class="v">bg-surface-critical</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-highlight)"></div><div class="n">highlight</div><div class="v">bg-surface-highlight</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-ai)"></div><div class="n">ai</div><div class="v">bg-surface-ai</div></div></div></body></html>
