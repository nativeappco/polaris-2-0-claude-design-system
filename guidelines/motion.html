<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Durations & easing</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div><div class="n" style="margin:0">duration-100</div><div class="v">100ms · hover</div></div><div><div class="n" style="margin:0">duration-200</div><div class="v">200ms · popover</div></div><div><div class="n" style="margin:0">duration-300</div><div class="v">300ms · modal</div></div><div><div class="n" style="margin:0">ease</div><div class="v">cubic-bezier(.25,.1,.25,1)</div></div><div><div class="n" style="margin:0">ease-out</div><div class="v">cubic-bezier(.19,.91,.38,1)</div></div><div><div class="n" style="margin:0">ease-out-emphasized</div><div class="v">cubic-bezier(.2,.8,0,1)</div></div></div></body></html>
