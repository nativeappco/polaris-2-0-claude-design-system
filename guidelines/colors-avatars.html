<!-- @dsCard group="Colors" viewport="700x130" name="Avatar palette" subtitle="Initials avatars hash to one of seven fills" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Avatar palette</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--p-color-avatar-one-bg-fill)"></div><div class="n">one</div><div class="v">avatar-one-bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-avatar-two-bg-fill)"></div><div class="n">two</div><div class="v">avatar-two-bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-avatar-three-bg-fill)"></div><div class="n">three</div><div class="v">avatar-three-bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-avatar-four-bg-fill)"></div><div class="n">four</div><div class="v">avatar-four-bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-avatar-five-bg-fill)"></div><div class="n">five</div><div class="v">avatar-five-bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-avatar-six-bg-fill)"></div><div class="n">six</div><div class="v">avatar-six-bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-avatar-seven-bg-fill)"></div><div class="n">seven</div><div class="v">avatar-seven-bg-fill</div></div></div></body></html>
