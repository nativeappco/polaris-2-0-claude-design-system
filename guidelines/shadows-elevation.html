<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row" style="gap:20px;padding:6px"><div><div style="width:100px;height:64px;background:#fff;border-radius:var(--p-border-radius-400);box-shadow:var(--p-shadow-section)"></div><div class="n">section</div></div><div><div style="width:100px;height:64px;background:#fff;border-radius:var(--p-border-radius-400);box-shadow:var(--p-shadow-popover)"></div><div class="n">popover</div></div><div><div style="width:100px;height:64px;background:#fff;border-radius:var(--p-border-radius-400);box-shadow:var(--p-shadow-dialog)"></div><div class="n">dialog</div></div><div><div style="width:100px;height:64px;background:#fff;border-radius:var(--p-border-radius-400);box-shadow:var(--p-shadow-toast)"></div><div class="n">toast</div></div><div><div style="width:100px;height:64px;background:#fff;border-radius:var(--p-border-radius-400);box-shadow:var(--p-shadow-input)"></div><div class="n">input</div></div></div></body></html>
