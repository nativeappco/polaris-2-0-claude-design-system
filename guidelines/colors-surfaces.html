<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Surfaces & neutrals</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--p-color-bg)"></div><div class="n">bg / page</div><div class="v">bg</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface)"></div><div class="n">surface (base)</div><div class="v">bg-surface</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-secondary)"></div><div class="n">subdued</div><div class="v">bg-surface-secondary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-surface-tertiary)"></div><div class="n">strong</div><div class="v">bg-surface-tertiary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-fill)"></div><div class="n">fill</div><div class="v">bg-fill</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-fill-secondary)"></div><div class="n">fill secondary</div><div class="v">bg-fill-secondary</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-inverse)"></div><div class="n">inverse / nav</div><div class="v">bg-inverse</div></div></div></body></html>
