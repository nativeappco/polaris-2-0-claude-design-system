<!-- @dsCard group="Colors" viewport="700x150" name="Accents & primary" subtitle="Primary button is near-black; tone accents drive icons and focus" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Accents & primary</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--p-color-button-primary-bg)"></div><div class="n">primary button</div><div class="v">button-primary-bg</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-critical-accent)"></div><div class="n">critical</div><div class="v">bg-critical-accent</div></div><div class="sw"><div class="chip" style="background:var(--p-color-icon-success-accent)"></div><div class="n">success</div><div class="v">icon-success-accent</div></div><div class="sw"><div class="chip" style="background:var(--p-color-icon-info-accent)"></div><div class="n">info</div><div class="v">icon-info-accent</div></div><div class="sw"><div class="chip" style="background:var(--p-color-icon-caution-accent)"></div><div class="n">caution</div><div class="v">icon-caution-accent</div></div><div class="sw"><div class="chip" style="background:var(--p-color-border-focus)"></div><div class="n">focus ring</div><div class="v">border-focus</div></div><div class="sw"><div class="chip" style="background:var(--p-color-bg-ai-accent)"></div><div class="n">ai</div><div class="v">bg-ai-accent</div></div></div></body></html>
