<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Gap & padding scale</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--p-color-bg);color:var(--p-color-text);font-family:var(--p-font-family-sans);font-feature-settings:var(--p-font-feature-settings);font-size:var(--p-font-size-325);line-height:var(--p-font-line-height-500)}.row{display:flex;flex-wrap:wrap;gap:12px}.sw{width:88px}.chip{height:48px;border-radius:var(--p-border-radius-300);box-shadow:inset 0 0 0 1px #0000000f}.n{font-weight:500;font-size:12px;line-height:16px;margin-top:6px}.v{font-size:11px;line-height:14px;color:var(--p-color-text-secondary);font-family:var(--p-font-family-mono)}</style></head><body><div style="display:grid;grid-template-columns:110px 1fr 60px;gap:6px 12px;align-items:center"><div class="v" style="color:var(--p-color-text)">small-500</div><div style="height:10px;width:var(--s-space-small-500);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">2px</div><div class="v" style="color:var(--p-color-text)">small-400</div><div style="height:10px;width:var(--s-space-small-400);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">4px</div><div class="v" style="color:var(--p-color-text)">small-300</div><div style="height:10px;width:var(--s-space-small-300);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">6px</div><div class="v" style="color:var(--p-color-text)">small-200</div><div style="height:10px;width:var(--s-space-small-200);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">8px</div><div class="v" style="color:var(--p-color-text)">small-100</div><div style="height:10px;width:var(--s-space-small-100);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">12px</div><div class="v" style="color:var(--p-color-text)">base</div><div style="height:10px;width:var(--s-space-base);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">16px</div><div class="v" style="color:var(--p-color-text)">large</div><div style="height:10px;width:var(--s-space-large);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">20px</div><div class="v" style="color:var(--p-color-text)">large-200</div><div style="height:10px;width:var(--s-space-large-200);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">24px</div><div class="v" style="color:var(--p-color-text)">large-300</div><div style="height:10px;width:var(--s-space-large-300);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">32px</div><div class="v" style="color:var(--p-color-text)">large-400</div><div style="height:10px;width:var(--s-space-large-400);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">40px</div><div class="v" style="color:var(--p-color-text)">large-500</div><div style="height:10px;width:var(--s-space-large-500);background:var(--p-color-bg-inverse);border-radius:2px"></div><div class="v">48px</div></div></body></html>
